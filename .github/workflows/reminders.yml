name: Study reminders
# Times are in UTC. 23:20 = 4:50 am IST, 08:05 = 1:35 pm IST, 16:05 = 9:35 pm IST.
# GitHub starts scheduled runs 15-45 minutes late at busy hours (seen 21-23 Nov 2026),
# so these early times land close to 5:30 am, 2 pm and 10 pm.
on:
  schedule:
    - cron: "20 23 * * *"
    - cron: "5 8 * * *"
    - cron: "5 16 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which reminder to send now (for testing)"
        type: choice
        options: [auto, morning, afternoon, night]
        default: morning
permissions:
  contents: read
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reminders
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund --silent
        working-directory: reminders
      - run: node send.mjs
        working-directory: reminders
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SLOT: ${{ inputs.slot || 'auto' }}
