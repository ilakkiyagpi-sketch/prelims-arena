name: Check question bank
# Runs on every push and pull request: catches broken questions and moved or removed questions before they ship.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Question bank
        run: python3 tools/check_data.py
      - name: Lock file is committed
        run: git diff --exit-code tools/qlock.json || (echo "Run python3 tools/check_data.py and commit tools/qlock.json"; exit 1)
      - name: JavaScript parses
        run: for f in app.js more.js sw.js notes/viewer.js reminders/send.mjs; do node --check "$f"; done
